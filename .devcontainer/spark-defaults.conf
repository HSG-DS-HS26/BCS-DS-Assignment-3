spark.master              spark://spark-master:7077
spark.driver.host         dev
spark.driver.memory       512m
spark.executor.memory     512m
spark.executor.cores      1
spark.default.parallelism 6

# DataFlint tab; event logs let the History Server (:18080) replay every job
spark.plugins             io.dataflint.spark.SparkDataflintPlugin
spark.eventLog.enabled    true
spark.eventLog.dir        file:/data/spark-events

# HDFS client settings (hdfs://namenode:8020/...). Spark doesn't read hadoop/hdfs-site.xml.
spark.hadoop.dfs.replication                  2
spark.hadoop.dfs.blocksize                    8m
spark.hadoop.dfs.client.use.datanode.hostname true
